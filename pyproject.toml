[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audit-insight-agent"
version = "0.1.0"
description = "Универсальное аудиторское ядро с DuckDB и RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "duckdb>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "pydantic>=2.9,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "PyYAML>=6,<7",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.3,<6",
]

[project.scripts]
audit-insight = "audit_insight_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_insight_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
