version: 1
environment: development

# Общее место для локальных и удалённых embedding-моделей.
embedding:
  provider: sentence_transformers
  model: /path/to/bge-m3
  device: null
  batch_size: 16

qdrant:
  # API сервера; dashboard доступен по /dashboard.
  url: http://127.0.0.1:6333
  path: .audit_insight/qdrant
  collection: audit_knowledge
  api_key_env: QDRANT_API_KEY

# Ouroboros запускается отдельным процессом; web-чат создаёт задачи через /api/tasks.
ouroboros:
  url: http://127.0.0.1:8765
  workspace: /path/to/ouroboros
  python_executable: .venv/bin/python
  password_env: OUROBOROS_NETWORK_PASSWORD
  poll_interval_seconds: 1
  timeout_seconds: 900

# Ouroboros после аудита может сам исправить общую логику в isolated worktree.
self_improvement:
  enabled: false
  require_detected_gap: true
  allow_blocking_clarification: true
  max_changed_files: 20

# Только зарегистрированные read-only реплики; пароли берутся из environment.
databases:
  fetch_size: 10000
  connections:
    audit_replica:
      engine: postgresql       # postgresql или greenplum
      host: db-read.example.local
      port: 5432
      database: audit_db
      user: audit_readonly
      password_env: AUDIT_REPLICA_PASSWORD
      sslmode: require
      connect_timeout_seconds: 15

storage:
  duckdb_path: .audit_insight/audit.duckdb

chunking:
  size: 1200
  overlap: 200

ingestion_output: outputs/ingestion-result.json
